auth_enabled: false

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4319
        http:
          endpoint: 0.0.0.0:4320

ingester:
  max_block_duration: 5m

metrics_generator:
  storage:
    path: /tmp/tempo/metrics-generator
  traces_storage:
    path: /tmp/tempo/metrics-generator-traces
  processor:
    local_blocks:
      filter_server_spans: false

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces
    wal:
      path: /tmp/tempo/wal

overrides:
  defaults:
    metrics_generator:
      processors: [local-blocks]
