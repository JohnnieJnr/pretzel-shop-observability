name: Main Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  discover:
    name: Discover Build Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_targets: ${{ steps.discover.outputs.has_targets }}
      target_count: ${{ steps.discover.outputs.target_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover directories with Dockerfiles
        id: discover
        run: python .github/utils/discover_docker_targets.py --repo-root .

      - name: Print discovered matrix
        run: |
          echo "Discovered targets: ${{ steps.discover.outputs.target_count }}"
          echo '${{ steps.discover.outputs.matrix }}'

  metrics-pipeline:
    name: Metrics Pipeline
    needs: discover
    if: ${{ needs.discover.outputs.has_targets == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${LOWER_REPO}-${{ matrix.name }}" >> $GITHUB_ENV
          
          # Detect Trivy ignore file
          IGNORE_PATH="./${{ matrix.context }}/.trivyignore"
          if [ "${{ matrix.context }}" = "." ]; then IGNORE_PATH="./.trivyignore"; fi
          if [ -f "$IGNORE_PATH" ]; then
            echo "TRIVY_IGNORE=$IGNORE_PATH" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build_image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest
          no-cache: true

      - name: Run Trivy scan
        id: trivy_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: ${{ env.TRIVY_IGNORE }}
          exit-code: "1"

      - name: Quiet SARIF Upload
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if API is reachable without the verbose "Code scanning reachable" logs
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/code-scanning/alerts?per_page=1")
          
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Code Scanning API unavailable (Status: $STATUS). Skipping upload."
            exit 0
          fi

          echo "Uploading results for ${{ matrix.name }}..."
          PAYLOAD=$(gzip -c trivy-results.sarif | base64 -w0)
          
          gh api --method POST /repos/${{ github.repository }}/code-scanning/sarifs \
            -f commit_sha="${{ github.sha }}" \
            -f ref="${{ github.ref }}" \
            -f sarif="$PAYLOAD" \
            -f category="trivy-${{ matrix.name }}" > /dev/null
          
          echo "✅ Upload complete."

      - name: Generate Summary and Push
        if: always()
        run: |
          # Run your existing Python summary logic here
          # ... (omitted for brevity, keep your existing Python block)
          
          # Final push only if scan passed
          if [ "${{ steps.trivy_scan.outcome }}" == "success" ]; then
            docker push ghcr.io/${{ env.IMAGE_NAME }}:latest
          else
            echo "::error::Scan failed. Image not pushed."
            exit 1
          fi