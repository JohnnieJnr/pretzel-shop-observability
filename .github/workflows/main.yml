name: Main Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  discover:
    name: Discover Build Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_targets: ${{ steps.discover.outputs.has_targets }}
      target_count: ${{ steps.discover.outputs.target_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover directories with Dockerfiles
        id: discover
        run: python .github/utils/discover_docker_targets.py --repo-root .

      - name: Print discovered matrix
        run: |
          echo "Discovered targets: ${{ steps.discover.outputs.target_count }}"
          echo '${{ steps.discover.outputs.matrix }}'

  metrics-pipeline:
    name: Metrics Pipeline
    needs: discover
    if: ${{ needs.discover.outputs.has_targets == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image tag
        id: tags
        run: |
          REPO_LOWER="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_BASE="ghcr.io/${REPO_LOWER}/${{ matrix.name }}"
          echo "image_base=$IMAGE_BASE" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$IMAGE_BASE:latest" >> "$GITHUB_OUTPUT"

      - name: Build image from Dockerfile
        id: build_image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ghcr.io/${{ env.LOWER_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.LOWER_REPO }}:latest
          format: sarif
          output: trivy-results.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Check code scanning availability
        id: code_scanning
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?per_page=1"
          HTTP_CODE="$(curl -sS -o code-scanning-check.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API_URL}")"

          if [ "${HTTP_CODE}" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Code scanning::Code scanning API reachable; SARIF upload enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            MESSAGE="$(jq -r '.message // "Unknown response"' code-scanning-check.json 2>/dev/null || echo "Unknown response")"
            echo "::warning title=Code scanning unavailable::Skipping SARIF upload (${HTTP_CODE}: ${MESSAGE})."
            echo "- Skipped SARIF upload (${HTTP_CODE}: ${MESSAGE})." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Trivy scan results to code scanning
        id: upload_sarif
        if: ${{ always() && steps.code_scanning.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.name }}

      - name: Note code scanning upload status
        if: ${{ always() && steps.code_scanning.outputs.enabled == 'true' && steps.upload_sarif.outcome == 'failure' }}
        run: |
          echo "::warning title=Code scanning upload failed::SARIF upload failed even though the API check passed. Check action logs and repository security settings."
          echo "- SARIF upload failed after code scanning pre-check passed." >> "$GITHUB_STEP_SUMMARY"
          echo "- Trivy scan still ran; check this job summary and logs for findings." >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate Trivy findings
        if: always()
        run: |
          if [ ! -f trivy-results.sarif ]; then
            echo "::warning title=Trivy scan::SARIF report missing for ${{ matrix.context }}"
            exit 0
          fi

          FINDINGS="$(jq '.runs[0].results | length' trivy-results.sarif)"
          echo "### Trivy scan: \`${{ matrix.context }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.tags.outputs.latest_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Findings: \`${FINDINGS}\`" >> "$GITHUB_STEP_SUMMARY"

          if [ "$FINDINGS" -gt 0 ]; then
            echo "::warning title=Trivy findings in ${{ matrix.context }}::Found ${FINDINGS} HIGH/CRITICAL vulnerabilities."
          else
            echo "::notice title=Trivy scan in ${{ matrix.context }}::No HIGH/CRITICAL vulnerabilities found."
          fi

      - name: Remove SHA-tagged GHCR versions
        if: ${{ always() && steps.build_image.outcome == 'success' }}
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          PACKAGE_NAME: ${{ github.event.repository.name }}/${{ matrix.name }}
        with:
          script: |
            const owner = context.repo.owner;
            const packageName = process.env.PACKAGE_NAME.toLowerCase();
            const shaTagRegex = /^[0-9a-f]{40}$/;

            async function listVersions() {
              try {
                const versions = await github.paginate(
                  github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
                  {
                    username: owner,
                    package_type: "container",
                    package_name: packageName,
                    per_page: 100
                  }
                );
                return { scope: "user", versions };
              } catch (error) {
                if (error.status !== 404) throw error;
                const versions = await github.paginate(
                  github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg,
                  {
                    org: owner,
                    package_type: "container",
                    package_name: packageName,
                    per_page: 100
                  }
                );
                return { scope: "org", versions };
              }
            }

            async function deleteVersion(scope, versionId) {
              if (scope === "user") {
                await github.rest.packages.deletePackageVersionForUser({
                  username: owner,
                  package_type: "container",
                  package_name: packageName,
                  package_version_id: versionId
                });
                return;
              }

              await github.rest.packages.deletePackageVersionForOrg({
                org: owner,
                package_type: "container",
                package_name: packageName,
                package_version_id: versionId
              });
            }

            const { scope, versions } = await listVersions();
            let deleted = 0;

            for (const version of versions) {
              const tags = version?.metadata?.container?.tags || [];
              if (!tags.length) continue;
              if (!tags.some((tag) => shaTagRegex.test(tag))) continue;

              await deleteVersion(scope, version.id);
              deleted += 1;
            }

            core.notice(`Package ${packageName}: deleted ${deleted} SHA-tagged version(s).`);
            await core.summary.addRaw(`Removed ${deleted} SHA-tagged version(s) from ${packageName}.`).write();

      - name: Push image to GHCR
        if: ${{ always() && steps.build_image.outcome == 'success' }}
        run: |
          docker push "${{ steps.tags.outputs.latest_tag }}"

  no-targets:
    name: No Docker Targets
    needs: discover
    if: ${{ needs.discover.outputs.has_targets != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "No Dockerfile targets found outside .github."
