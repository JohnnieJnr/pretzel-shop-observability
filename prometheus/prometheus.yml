global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: pretzel-shop

scrape_configs:
  - job_name: pretzel-shop-backend
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3000"]
        labels:
          service: pretzel-shop-backend
          environment: staging

  - job_name: otel-collector
    scrape_interval: 15s
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          service: otel-collector
          environment: staging
