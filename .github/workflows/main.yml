name: Main Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  discover:
    name: Discover Build Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_targets: ${{ steps.discover.outputs.has_targets }}
      target_count: ${{ steps.discover.outputs.target_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover directories with Dockerfiles
        id: discover
        run: python .github/utils/discover_docker_targets.py --repo-root .

      - name: Print discovered matrix
        run: |
          echo "Discovered targets: ${{ steps.discover.outputs.target_count }}"
          echo '${{ steps.discover.outputs.matrix }}'

  metrics-pipeline:
    name: Metrics Pipeline
    needs: discover
    if: ${{ needs.discover.outputs.has_targets == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase repo name
        run: echo "LOWER_REPO=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set image name for target
        run: echo "IMAGE_NAME=${{ env.LOWER_REPO }}-${{ matrix.name }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image from Dockerfile
        id: build_image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest
          no-cache: true

      - name: Detect Trivy ignore file
        id: trivy_ignore
        run: |
          # Trivy expects repo‑relative paths; always prefix with ./ for clarity
          if [ "${{ matrix.context }}" = "." ]; then
            IGNORE_FILE="./.trivyignore"
          else
            IGNORE_FILE="./${{ matrix.context }}/.trivyignore"
          fi
          if [ -f "$IGNORE_FILE" ]; then
            echo "trivyignores=$IGNORE_FILE" >> "$GITHUB_OUTPUT"
            echo "Using Trivy ignore file at $IGNORE_FILE"
          else
            echo "No Trivy ignore file for ${{ matrix.context }}"
          fi

      - name: Run Trivy scan
        id: trivy_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: ${{ steps.trivy_ignore.outputs.trivyignores }}
          exit-code: "1"

      - name: Check code scanning availability
        id: code_scanning
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?per_page=1"
          HTTP_CODE="$(curl -sS -o code-scanning-check.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API_URL}")"

          if [ "${HTTP_CODE}" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Code scanning::Code scanning API reachable; SARIF upload enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            MESSAGE="$(jq -r '.message // "Unknown response"' code-scanning-check.json 2>/dev/null || echo "Unknown response")"
            echo "::warning title=Code scanning unavailable::Skipping SARIF upload (${HTTP_CODE}: ${MESSAGE})."
            echo "- Skipped SARIF upload (${HTTP_CODE}: ${MESSAGE})." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Trivy scan results to code scanning
        id: upload_sarif
        if: ${{ always() && steps.code_scanning.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.name }}

      - name: Note code scanning upload status
        if: ${{ always() && steps.code_scanning.outputs.enabled == 'true' && steps.upload_sarif.outcome == 'failure' }}
        run: |
          echo "::warning title=Code scanning upload failed::SARIF upload failed even though the API check passed. Check action logs and repository security settings."
          echo "- SARIF upload failed after code scanning pre-check passed." >> "$GITHUB_STEP_SUMMARY"
          echo "- Trivy scan still ran; check this job summary and logs for findings." >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate Trivy findings
        if: always()
        run: |
          if [ ! -f trivy-results.sarif ]; then
            echo "::warning title=Trivy scan::SARIF report missing for ${{ matrix.context }}"
            exit 0
          fi

          FINDINGS="$(jq '.runs[0].results | length' trivy-results.sarif)"
          echo "### Trivy scan: \`${{ matrix.context }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`ghcr.io/${{ env.LOWER_REPO }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Findings: \`${FINDINGS}\`" >> "$GITHUB_STEP_SUMMARY"

          if [ "$FINDINGS" -gt 0 ]; then
            FIRST_ISSUE="$(jq -r '.runs[0].results[0] | (.ruleId + ": " + (.message.text // "No description provided"))' trivy-results.sarif)"
            # keep the annotation concise
            FIRST_ISSUE_TRIMMED="$(echo \"$FIRST_ISSUE\" | tr -d '\n' | head -c 200)"
            echo "::warning title=Trivy findings in ${{ matrix.context }}::Found ${FINDINGS} HIGH/CRITICAL vulnerabilities. Top issue: ${FIRST_ISSUE_TRIMMED}"
            echo "- Top issue: \`${FIRST_ISSUE_TRIMMED}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=Trivy scan in ${{ matrix.context }}::No HIGH/CRITICAL vulnerabilities found."
          fi

      - name: Summarize Trivy results (table)
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          sarif_path = Path("trivy-results.sarif")
          if not sarif_path.exists():
              raise SystemExit("SARIF report not found")

          data = json.loads(sarif_path.read_text())
          runs = data.get("runs", [])
          if not runs:
              raise SystemExit("No runs in SARIF report")

          run = runs[0]
          rules = {rule.get("id"): rule for rule in run.get("tool", {}).get("driver", {}).get("rules", [])}
          results = run.get("results", [])

          severity_order = ["CRITICAL", "HIGH", "MEDIUM", "LOW"]
          counts = {sev: 0 for sev in ["LOW", "MEDIUM", "HIGH", "CRITICAL"]}

          rows = []
          for res in results:
              rule_id = res.get("ruleId", "-")
              rule = rules.get(rule_id, {})
              props = rule.get("properties", {})

              severity = (props.get("severity") or res.get("level") or "UNKNOWN").upper()
              if severity in counts:
                  counts[severity] += 1

              pkg = props.get("packageName") or "-"
              status = props.get("status") or ("fixed" if props.get("fixedVersion") else "needs-fix")
              installed = props.get("packageVersion") or "-"
              fixed = props.get("fixedVersion") or "-"
              title = (
                  (rule.get("shortDescription", {}) or {}).get("text")
                  or rule.get("name")
                  or (rule.get("fullDescription", {}) or {}).get("text")
                  or rule_id
              )
              title = " ".join(str(title).split())
              if len(title) > 90:
                  title = title[:87] + "..."

              rows.append((pkg, rule_id, severity, status, installed, fixed, title))

          order_index = {sev: idx for idx, sev in enumerate(severity_order)}
          rows.sort(key=lambda r: (order_index.get(r[2], len(order_index)), r[1]))

          total = len(rows)
          headers = [
              "Library",
              "Vulnerability",
              "Severity",
              "Status",
              "Installed Version",
              "Fixed Version",
              "Title",
          ]

          table = [headers] + rows
          widths = [max(len(str(row[i])) for row in table) for i in range(len(headers))]

          def border(fill="-"):
              return "+" + "+".join(fill * (widths[i] + 2) for i in range(len(headers))) + "+"

          def fmt(row):
              return "| " + " | ".join(str(row[i]).ljust(widths[i]) for i in range(len(headers))) + " |"

          lines = []
          lines.append(
              f"Total: {total} (LOW: {counts['LOW']}, MEDIUM: {counts['MEDIUM']}, HIGH: {counts['HIGH']}, CRITICAL: {counts['CRITICAL']})"
          )
          lines.append("")
          lines.append(border())
          lines.append(fmt(headers))
          lines.append(border())
          for row in rows:
              lines.append(fmt(row))
          if rows:
              lines.append(border())
          else:
              # still close the table even when empty
              lines.append(border())

          table_text = "\n".join(lines) + "\n"
          print(table_text)

          Path("trivy-table.txt").write_text(table_text)
          PY

                    {
                      echo "" >> "$GITHUB_STEP_SUMMARY"
                      echo "#### Trivy scan summary (tabular)" >> "$GITHUB_STEP_SUMMARY"
                      cat trivy-table.txt >> "$GITHUB_STEP_SUMMARY"
                    }

      - name: Fail if Trivy found vulnerabilities
        if: ${{ always() && steps.trivy_scan.outcome == 'failure' }}
        run: |
          echo "::error title=Trivy detected HIGH/CRITICAL issues::See the Trivy table above for details."
          exit 1

      - name: Push image to GHCR
        if: ${{ always() && steps.build_image.outcome == 'success' && steps.trivy_scan.outcome == 'success' }}
        run: |
          docker push ghcr.io/${{ env.IMAGE_NAME }}:latest

  no-targets:
    name: No Docker Targets
    needs: discover
    if: ${{ needs.discover.outputs.has_targets != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "No Dockerfile targets found outside .github."
