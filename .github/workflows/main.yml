name: Main Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  discover:
    name: Discover Build Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_targets: ${{ steps.discover.outputs.has_targets }}
      target_count: ${{ steps.discover.outputs.target_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover directories with Dockerfiles
        id: discover
        run: python .github/utils/discover_docker_targets.py --repo-root .

      - name: Print discovered matrix
        run: |
          echo "Discovered targets: ${{ steps.discover.outputs.target_count }}"
          echo '${{ steps.discover.outputs.matrix }}'

  metrics-pipeline:
    name: Metrics Pipeline
    needs: discover
    if: ${{ needs.discover.outputs.has_targets == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase repo name
        run: echo "LOWER_REPO=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set image name for target
        run: echo "IMAGE_NAME=${{ env.LOWER_REPO }}-${{ matrix.name }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image from Dockerfile
        id: build_image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest
          no-cache: true

      - name: Detect Trivy ignore file
        id: trivy_ignore
        run: |
          # Trivy expects repo‑relative paths; always prefix with ./ for clarity
          if [ "${{ matrix.context }}" = "." ]; then
            IGNORE_FILE="./.trivyignore"
          else
            IGNORE_FILE="./${{ matrix.context }}/.trivyignore"
          fi
          if [ -f "$IGNORE_FILE" ]; then
            python3 .github/utils/workflow_outputs.py --set "trivyignores=$IGNORE_FILE"
            echo "Using Trivy ignore file at $IGNORE_FILE"
          else
            echo "No Trivy ignore file for ${{ matrix.context }}"
          fi

      - name: Run Trivy scan
        id: trivy_scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: ${{ steps.trivy_ignore.outputs.trivyignores }}
          exit-code: "1"

      - name: Check code scanning availability
        id: code_scanning
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?per_page=1"
          HTTP_CODE="$(curl -sS -o code-scanning-check.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API_URL}")"

          if [ "${HTTP_CODE}" = "200" ]; then
            python3 .github/utils/workflow_outputs.py --set "enabled=true"
            echo "::notice title=Code scanning::Code scanning API reachable; SARIF upload enabled."
          else
            python3 .github/utils/workflow_outputs.py --set "enabled=false"
            MESSAGE="$(jq -r '.message // "Unknown response"' code-scanning-check.json 2>/dev/null || echo "Unknown response")"
            echo "::warning title=Code scanning unavailable::Skipping SARIF upload (${HTTP_CODE}: ${MESSAGE})."
            echo "- Skipped SARIF upload (${HTTP_CODE}: ${MESSAGE})." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Trivy scan results to code scanning 
        id: upload_sarif 
        if: ${{ always() && steps.code_scanning.outputs.enabled == 'true' }} 
        uses: github/codeql-action/upload-sarif@v4 
        with: 
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.name }}

      - name: Annotate Trivy findings
        if: always()
        run: |
          if [ ! -f trivy-results.sarif ]; then
            echo "::warning title=Trivy scan::SARIF report missing for ${{ matrix.context }}"
            exit 0
          fi

          # Count HIGH + CRITICAL only
          FINDINGS=$(jq '
            [
              .runs[0].results[]
              | . as $r
              | .ruleId as $id
              | .level as $lvl
              | select($lvl == "error" or $lvl == "warning")
            ] | length
          ' trivy-results.sarif)

          echo "### 🔎 Trivy scan: \`${{ matrix.context }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`ghcr.io/${{ env.LOWER_REPO }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- HIGH/CRITICAL findings: \`${FINDINGS}\`" >> "$GITHUB_STEP_SUMMARY"

          if [ "$FINDINGS" -gt 0 ]; then

            # Get highest severity issue (error first, then warning)
            TOP_ISSUE=$(jq -r '
              .runs[0].results
              | map(select(.level == "error" or .level == "warning"))
              | sort_by(.level)        # "error" < "warning"
              | .[0]
              | (.ruleId + ": " + (.message.text // "No description provided"))
            ' trivy-results.sarif)

            TOP_ISSUE_TRIMMED=$(echo "$TOP_ISSUE" | tr -d '\n' | head -c 200)

            echo "::warning title=Trivy findings in ${{ matrix.context }}::Found ${FINDINGS} HIGH/CRITICAL vulnerabilities. Top issue: ${TOP_ISSUE_TRIMMED}"

            echo "- Top issue: \`${TOP_ISSUE_TRIMMED}\`" >> "$GITHUB_STEP_SUMMARY"

          else
            echo "::notice title=Trivy scan in ${{ matrix.context }}::No HIGH/CRITICAL vulnerabilities found."
            echo "✅ No HIGH/CRITICAL vulnerabilities found." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Summarize Trivy results (PR friendly)
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("trivy-results.sarif").read_text())
          run = data.get("runs", [{}])[0]

          rules = {r.get("id"): r for r in run.get("tool", {}).get("driver", {}).get("rules", [])}
          results = run.get("results", [])

          level_map = {
              "error": "HIGH",
              "warning": "MEDIUM",
              "note": "LOW",
          }

          findings = []
          seen = set()
          counts = {"CRITICAL": 0, "HIGH": 0, "MEDIUM": 0, "LOW": 0}

          for res in results:
              rule_id = res.get("ruleId", "-")
              rule = rules.get(rule_id, {})
              props = rule.get("properties", {})

              pkg = props.get("packageName", "-")
              installed = props.get("packageVersion", "-")
              fixed = props.get("fixedVersion", "-")
              status = "fixed" if fixed else "needs-fix"

              severity = props.get("severity")
              if severity:
                  severity = severity.upper()
              else:
                  severity = level_map.get(res.get("level", "").lower(), "UNKNOWN")

              key = (pkg, rule_id)
              if key in seen:
                  continue
              seen.add(key)

              if severity in counts:
                  counts[severity] += 1

              title = (
                  rule.get("shortDescription", {}).get("text")
                  or rule.get("name")
                  or rule_id
              )
              title = " ".join(str(title).split())
              if len(title) > 100:
                  title = title[:97] + "..."

              findings.append((pkg, rule_id, severity, status, installed, fixed, title))

          order = {"CRITICAL": 0, "HIGH": 1, "MEDIUM": 2, "LOW": 3}
          findings.sort(key=lambda x: (order.get(x[2], 99), x[1]))

          summary_lines = []
          summary_lines.append("## 🔎 Trivy Scan Summary\n")

          total = len(findings)
          summary_lines.append(
              f"**Total:** {total}  \n"
              f"**CRITICAL:** {counts['CRITICAL']} | "
              f"**HIGH:** {counts['HIGH']} | "
              f"**MEDIUM:** {counts['MEDIUM']} | "
              f"**LOW:** {counts['LOW']}\n"
          )

          if not findings:
              summary_lines.append("✅ No vulnerabilities found.\n")
          else:
              summary_lines.append("| Library | CVE | Severity | Status | Installed | Fixed | Title |")
              summary_lines.append("|---------|-----|----------|--------|------------|--------|-------|")

              for row in findings:
                  summary_lines.append(
                      f"| {row[0]} | {row[1]} | {row[2]} | {row[3]} | {row[4]} | {row[5]} | {row[6]} |"
                  )

          summary = "\n".join(summary_lines) + "\n"

          print(summary)
          Path("trivy-summary.md").write_text(summary)
          PY

          cat trivy-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if Trivy found vulnerabilities
        if: ${{ always() && steps.trivy_scan.outcome == 'failure' }}
        run: |
          echo "::error title=Trivy detected HIGH/CRITICAL issues::See the Trivy table above for details."
          exit 1

      - name: Push image to GHCR
        if: ${{ always() && steps.build_image.outcome == 'success' && steps.trivy_scan.outcome == 'success' }}
        run: |
          docker push ghcr.io/${{ env.IMAGE_NAME }}:latest

 